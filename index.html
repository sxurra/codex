<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bundled Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" sc-camel-view-box="0 0 100 100"><rect width="100" height="100" fill="#0b0a09"></rect><text x="50" y="62" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#e2c48d">СИ</text></svg></div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>

document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.case[role="button"]')){
    e.preventDefault();
    const dialog=e.target.querySelector('.case-dialog');
    if(dialog&&!dialog.open)dialog.showModal();
  }
},true);
document.addEventListener('click', function(e) {
  const open = e.target.closest('.case-open');
  if (open) { const dialog = open.parentElement.querySelector('.case-dialog'); if (dialog) dialog.showModal(); return; }
  const close = e.target.closest('.case-close');
  if (close) { close.closest('dialog').close(); return; }
  if (e.target.matches('.case-dialog')) e.target.close();
}, true);
let wizardStep = 0;
function paintWizard() { const steps=[...document.querySelectorAll('#profile-form .wizard-step')]; if(!steps.length)return; steps.forEach((step,i)=>step.classList.toggle('active',i===wizardStep)); const count=document.querySelector('.wizard-counter');if(count)count.textContent=String(wizardStep+1).padStart(2,'0')+' / '+String(steps.length).padStart(2,'0'); const bar=document.querySelector('.wizard-progress span');if(bar)bar.style.width=((wizardStep+1)/steps.length*100)+'%'; document.querySelector('.wizard-prev').hidden=wizardStep===0;document.querySelector('.wizard-next').hidden=wizardStep===steps.length-1;document.querySelector('.wizard-finish').hidden=wizardStep!==steps.length-1; }
setInterval(()=>{const x=document.querySelector('#profile-form .wizard-step');if(x&&!document.querySelector('#profile-form .wizard-step.active'))paintWizard()},800);
document.addEventListener('click',function(e){const card=e.target.closest('.case');if(card&&!e.target.closest('dialog')&&!e.target.closest('a')){const d=card.querySelector('dialog');if(d&&!d.open)d.showModal()}if(e.target.closest('.wizard-next')){const steps=[...document.querySelectorAll('#profile-form .wizard-step')];const step=steps[wizardStep];const inputs=[...step.querySelectorAll('input')];const msg=document.querySelector('.wizard-message');if(inputs.length&&!inputs.some(i=>(i.type==='checkbox'||i.type==='radio')?i.checked:!!i.value.trim())){msg.textContent='Выберите или впишите ответ, чтобы продолжить.';return}msg.textContent='';wizardStep=Math.min(steps.length-1,wizardStep+1);paintWizard();steps[wizardStep].scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'})}if(e.target.closest('.wizard-prev')){wizardStep=Math.max(0,wizardStep-1);paintWizard();document.querySelectorAll('#profile-form .wizard-step')[wizardStep].scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'})}if(e.target.closest('.wizard-finish')){const form=document.querySelector('#profile-form');if(!form.querySelector('[name=phone]').value.trim()){document.querySelector('.wizard-message').textContent='Укажите номер телефона.';return}const text=[...new FormData(form).entries()].map(([k,v])=>k+': '+v).join('\n');navigator.clipboard.writeText(text).then(()=>{document.querySelector('.wizard-message').textContent='Ответы скопированы. Их можно отправить команде при обращении.'}).catch(()=>{document.querySelector('.wizard-message').textContent='Ответы заполнены. Скопируйте их вручную перед обращением.'})}},true);
const journeyPoll=setInterval(()=>{
  if(!document.querySelector('.journey-scroll-stage'))return;
  clearInterval(journeyPoll);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  let scheduled=false,lastActive=-1,lastTimeline=null;
  function paint(){
    scheduled=false;
    // The page renderer may replace this section after hydration; read live nodes.
    const stage=document.querySelector('.journey-scroll-stage');
    if(!stage)return;
    const timeline=stage.querySelector('.journey-timeline');
    const steps=[...stage.querySelectorAll('.journey-step')];
    const nodes=[...stage.querySelectorAll('.journey-node')];
    const path=stage.querySelector('.journey-arc-path');
    if(!timeline||steps.length!==6||nodes.length!==6||!path)return;
    const sticky=stage.querySelector('.journey-sticky');
    const arc=stage.querySelector('.journey-arc > svg');
    if(!sticky||!arc)return;
    // Pin the whole composition around the viewport midpoint.
    const minTop=window.innerWidth<=600?115:90;
    const stickyTop=Math.max(minTop,(window.innerHeight-sticky.offsetHeight)/2);
    sticky.style.setProperty('--journey-sticky-top',stickyTop+'px');
    const rect=stage.getBoundingClientRect();
    const range=Math.max(1,rect.height-sticky.offsetHeight);
    const progress=Math.max(0,Math.min(1,(stickyTop-rect.top)/range));
    const length=path.getTotalLength();
    const svgRect=arc.getBoundingClientRect();
    // Match every reveal to the point where the drawn path reaches its dot.
    const nodeFractions=nodes.map(node=>{
      const dotRect=node.querySelector('.journey-node-dot').getBoundingClientRect();
      const x=(dotRect.left+dotRect.width/2-svgRect.left)/svgRect.width*1200;
      let low=0,high=length;
      for(let i=0;i<16;i++){
        const mid=(low+high)/2;
        if(path.getPointAtLength(mid).x<x)low=mid;else high=mid;
      }
      return (low+high)/2/length;
    });
    const drawn=nodeFractions[0]+(1-nodeFractions[0])*progress;
    let next=0;
    for(let i=1;i<nodeFractions.length;i++)if(drawn>=nodeFractions[i]+.005)next=i;
    stage.classList.add('is-enhanced');
    const clip=stage.querySelector('.journey-path-clip-rect');
    if(clip)clip.setAttribute('width',String(path.getPointAtLength(length*drawn).x));
    steps.forEach((item,i)=>{item.classList.toggle('is-revealed',i<=next);item.classList.toggle('is-current',i===next)});
    nodes.forEach((item,i)=>{item.classList.toggle('is-revealed',i<=next);item.classList.toggle('is-current',i===next)});
    if(window.innerWidth<=900&&(next!==lastActive||timeline!==lastTimeline)){
      const target=steps[next];
      const left=target.getBoundingClientRect().left-timeline.getBoundingClientRect().left+timeline.scrollLeft-20;
      timeline.scrollTo({left:Math.max(0,left),behavior:'smooth'});
    }
    lastActive=next;lastTimeline=timeline;
  }
  function schedule(){if(!scheduled){scheduled=true;requestAnimationFrame(paint)}}
  window.addEventListener('scroll',schedule,{passive:true});
  document.addEventListener('scroll',schedule,{passive:true,capture:true});
  window.addEventListener('resize',schedule,{passive:true});
  setInterval(schedule,100);
  schedule();
},300);
// Observe the live section: the page renderer can replace its DOM after hydration.
const decisionScheduled=new WeakSet();
setInterval(()=>{
  const section=document.querySelector('.decision-journey');
  if(!section)return;
  const rect=section.getBoundingClientRect();
  if(rect.top>innerHeight*.85||rect.bottom<innerHeight*.15)return;
  section.classList.add('is-visible');
  if(decisionScheduled.has(section))return;
  decisionScheduled.add(section);
  // Guarantee readable content even if a browser drops a delayed animation.
  setTimeout(()=>{if(section.isConnected)section.classList.add('is-complete')},3600);
},160);
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);

;margin:16px 0 96px;color:#e2c48d\">И называть её игрой.</p>\n    <div style=\"font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:#a89f92;margin-bottom:24px\">ПОСМОТРИТЕ ПРИМЕРЫ УСПЕШНЫХ ИГР - ЛИДЕРОВ РЫНКА</div>\n    <div style=\"display:{{ galleryDisplay }};grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1 * {{ galleryBleed }});padding:0 {{ galleryBleed }}\">\n      <sc-for list=\"{{ games }}\" as=\"g\" hint-placeholder-count=\"6\">\n        <button sc-camel-on-click=\"{{ g.open }}\"  sc-camel-on-focus=\"{{ playClip }}\" sc-camel-on-blur=\"{{ pauseClip }}\" style=\"flex:0 0 78%;scroll-snap-align:start;text-align:left;font:inherit;color:#ede6da;background:none;border:none;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:14px\" style-hover=\"color:#e2c48d\">\n          <div style=\"width:100%;aspect-ratio:16/10;pointer-events:none;overflow:hidden;border-radius:4px;background:#11100e\"><sc-if value=\"{{ g.video }}\" hint-placeholder-val=\"{{ false }}\"><video data-src=\"{{ g.video }}\" data-poster=\"{{ g.poster }}\" muted=\"{{ true }}\" loop=\"{{ true }}\" sc-camel-plays-inline=\"{{ true }}\" preload=\"metadata\" style=\"width:100%;height:100%;object-fit:cover;display:block\"></video></sc-if></div>\n          <div>\n            <div style=\"font-family:'Cormorant Garamond',serif;font-size:28px;line-height:1.1\">{{ g.title }}</div>\n            <div style=\"font-size:14px;color:#a89f92;margin-top:4px\">{{ g.line }}</div>\n          </div>\n        </button>\n      </sc-for>\n    </div>\n    <div style=\"font-size:12px;color:#8d857a;margin-top:20px\">* Оценка независимых аналитиков. Издатель эти данные не раскрывал.</div>\n  </div>\n</section>\n\n<section data-screen-label=\"06 Анализ рынка\" class=\"risk-story\"><div class=\"risk-glow risk-glow-a\"></div><div class=\"risk-glow risk-glow-b\"></div><div class=\"risk-inner\">\n  <div class=\"risk-intro\"><div class=\"risk-heading\"><h2>Минимизируем <em>риск</em></h2><p>Смотрим, что уже зарабатывает и берём лучшее для вашей игры</p></div></div>\n  <div class=\"risk-metrics\"><div class=\"risk-metric\"><span class=\"risk-metric-top\">01 / ВЫРУЧКА ЛИДЕРОВ ЗА МЕСЯЦ</span><strong>$184 <small>млн</small></strong><span>Показывает размер спроса</span></div><div class=\"risk-metric\"><span class=\"risk-metric-top\">02 / РОСТ ЗА ГОД</span><strong>+42<small>%</small></strong><span>Отслеживаем динамику жанра</span></div><div class=\"risk-metric\"><span class=\"risk-metric-top\">03 / ВЫРУЧКА ЗА 12 МЕСЯЦЕВ</span><strong>$1,86 <small>млрд</small></strong><span>Оцениваем масштаб рынка</span></div></div>\n  <div class=\"risk-stage\"><div class=\"risk-stage-title\">Увидеть, что <em>работает.</em><br>Понять, <em>почему.</em><br>Создать своё.</div></div>\n  <div class=\"risk-analytics\"><div class=\"risk-data\"><div class=\"risk-data-head\"><div><h3>Не интуиция. <em>Данные.</em></h3></div><div class=\"risk-filter\">Стратегии <span>·</span> Телефон <span>·</span> 12 месяцев</div></div><div class=\"risk-data-grid\"><div class=\"risk-graph\"><div class=\"risk-graph-head\"><span>Месячная выручка лидеров</span><strong>$130 млн <span>→</span> $184 млн</strong></div><svg viewBox=\"0 0 1000 260\" preserveAspectRatio=\"none\" role=\"img\" aria-label=\"Пример графика выручки от 130 до 184 миллионов долларов\"><defs><linearGradient id=\"riskAreaGradient\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#e2c48d\" stop-opacity=\".48\"/><stop offset=\"1\" stop-color=\"#e2c48d\" stop-opacity=\"0\"/></linearGradient></defs><path d=\"M0 218 C85 211 140 204 220 188 S360 181 440 163 S590 151 690 121 S820 109 900 78 S962 62 1000 52 L1000 260 L0 260 Z\" fill=\"url(#riskAreaGradient)\"/><path class=\"risk-graph-line\" d=\"M0 218 C85 211 140 204 220 188 S360 181 440 163 S590 151 690 121 S820 109 900 78 S962 62 1000 52\" fill=\"none\" stroke=\"#e2c48d\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"/><circle cx=\"1000\" cy=\"52\" r=\"7\" fill=\"#f4dbaf\"/></svg><div class=\"risk-graph-axis\"><span>Год назад</span><span>Сейчас</span></div></div><div class=\"risk-revenue\"><span>ЧТО ПРИНОСИТ ВЫРУЧКУ</span><div><strong>38%</strong><small>Сезонные события</small></div><div><strong>27%</strong><small>Кланы и битвы</small></div><div><strong>21%</strong><small>Боевой пропуск</small></div></div></div><p class=\"risk-disclaimer\">Иллюстративный пример: показатели и график условные.</p></div>\n  <div class=\"risk-video\"><iframe id=\"analytics-video\" title=\"Видео игрового процесса, фрагмент с 0:38 до 1:21\" src=\"https://www.youtube-nocookie.com/embed/jJN1JLeeiG8?start=38&amp;end=81&amp;autoplay=1&amp;mute=1&amp;loop=1&amp;playlist=jJN1JLeeiG8&amp;playsinline=1&amp;enablejsapi=1&amp;rel=0&amp;controls=0&amp;fs=0&amp;disablekb=1&amp;iv_load_policy=3\" loading=\"lazy\" allow=\"autoplay; encrypted-media; picture-in-picture\"></iframe></div></div>\n</div></section>\n<section data-screen-label=\"06 Решения и тест\" class=\"decision-journey\"><div class=\"decision-ambient\"></div><div class=\"decision-inner\"><div class=\"decision-intro\"><h2>Вы принимаете решение<br><em>на каждом этапе.</em></h2><p>Каждый следующий шаг начинается после того, как вы увидели результат предыдущего.</p></div><div class=\"decision-map\"><div class=\"decision-track\"><svg viewBox=\"0 0 1200 280\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path class=\"decision-path-base\" d=\"M0 222 C190 220 240 235 350 202 S560 164 640 170 S830 172 910 112 S1070 36 1200 42\"/><path class=\"decision-path-draw\" d=\"M0 222 C190 220 240 235 350 202 S560 164 640 170 S830 172 910 112 S1070 36 1200 42\"/></svg><span class=\"decision-dot decision-dot-1\"></span><span class=\"decision-dot decision-dot-2\"></span><span class=\"decision-dot decision-dot-3\"></span><div class=\"decision-callout\"><strong>10%</strong><span>от полного бюджета</span></div></div><div class=\"decision-stages\"><article class=\"decision-stage\"><span class=\"decision-stage-num\">01 / ПРОВЕРЯЕМ ИДЕЮ</span><h3>Концепт</h3><p>Анализ рынка, идея, механики и план игры.</p><div class=\"decision-result\">Вы видите концепцию и решаете, подходит ли направление.</div></article><article class=\"decision-stage\"><span class=\"decision-stage-num\">02 / ПРОВЕРЯЕМ СПРОС</span><h3>Тестовая версия</h3><p>Играбельная сборка и проверка спроса на реальных игроках.</p><div class=\"decision-result\">Вы смотрите на реакцию игроков и решаете, идти ли дальше.</div></article><article class=\"decision-stage\"><span class=\"decision-stage-num\">03 / ВЫХОДИМ НА РЫНОК</span><h3>Разработка и запуск</h3><p>Полная версия и выход в сторы.</p><div class=\"decision-result\">Вы утверждаете итоговый продукт перед запуском.</div></article></div></div><div class=\"decision-assurance\"><div class=\"decision-assurance-head\"><span class=\"decision-eyebrow\">ВАШ КОНТРОЛЬ</span><h3>Всё важное<br><em>закреплено.</em></h3><p>Решения, права и результаты этапов остаются прозрачными от первого обсуждения до запуска.</p></div><div class=\"decision-assurance-list\"><div><span>01</span><h4>Игра принадлежит вам</h4><p>Права на игру и код закреплены в договоре.</p></div><div><span>02</span><h4>План известен заранее</h4><p>До старта фиксируем этапы, сроки и результат каждого этапа.</p></div><div><span>03</span><h4>После теста решаете вы</h4><p>Смотрите результаты и выбираете: продолжать или остановиться.</p></div><div><span>04</span><h4>Каждый этап можно проверить</h4><p>Получаете отчёт и демонстрацию рабочей сборки.</p></div></div></div></div></section>\n\n\n<section ref=\"{{ moneyRef }}\" data-screen-label=\"04 Деньги\" style=\"position:relative;padding:clamp(120px,14vw,200px) clamp(20px,5vw,64px);overflow:hidden\">\n  <div style=\"position:absolute;inset:0\"><image-slot id=\"money-city\" shape=\"rect\" placeholder=\"Кадр с городом\"></image-slot></div>\n  <div style=\"position:absolute;inset:0;background:rgba(11,10,9,0.8);pointer-events:none\"></di x 0 0;max-width:420px\">Точный бюджет зависит от масштаба игры и запуска.</p>\n      </div>\n      <div>\n        <sc-if value=\"{{ leadOpen }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:24px\">\n            <label style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;color:#a89f92\">Имя\n              <input value=\"{{ name }}\" sc-camel-on-change=\"{{ onName }}\" placeholder=\"Как к вам обращаться\" style=\"font-size:17px;color:#ede6da;background:transparent;border:none;border-bottom:1px solid rgba(237,230,218,0.3);padding:12px 0;outline:none\" style-focus=\"border-bottom-color:#e2c48d\">\n            </label>\n            <label style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;color:#a89f92\">Telegram, MAX или телефон\n              <input value=\"{{ contact }}\" sc-camel-on-change=\"{{ onContact }}\" placeholder=\"@username или +7…\" style=\"font-size:17px;color:#ede6da;background:transparent;border:none;border-bottom:1px solid rgba(237,230,218,0.3);padding:12px 0;outline:none\" style-focus=\"border-bottom-color:#e2c48d\">\n            </label>\n            <div>\n              <div style=\"font-size:14px;color:#a89f92;margin-bottom:12px\">Что важнее</div>\n              <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n                <sc-for list=\"{{ leadMotives }}\" as=\"m\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ m.pick }}\" style=\"font:inherit;font-size:15px;color:{{ m.color }};background:{{ m.bg }};border:1px solid {{ m.border }};padding:12px 20px;border-radius:999px;cursor:pointer\">{{ m.label }}</button>\n                </sc-for>\n              </div>\n            </div>\n            <div>\n              <div style=\"font-size:14px;color:#a89f92;margin-bottom:12px\">Бюджет</div>\n              <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n                <sc-for list=\"{{ leadBudgets }}\" as=\"b\" hint-placeholder ction:column;gap:10px\">\n      <div style=\"font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600\">Своя игра</div>\n      <div style=\"font-size:13px;color:#8d857a\">Реквизиты юрлица</div>\n      <a href=\"#\" style=\"font-size:13px\">Политика обработки данных</a>\n    </div>\n    <p style=\"margin:0;max-width:720px;font-size:13px;line-height:1.6;color:#8d857a\">Материалы не являются офертой, инвестиционной рекомендацией или обещанием дохода. Результаты других проектов не гарантируют такой же результат. Игра может не окупиться. Условия определяются договором. ИИ-кадры — визуализация концепции, не кадры готовой игры. Названия и материалы игр принадлежат их правообладателям.</p>\n  </div>\n</footer>\n\n<sc-if value=\"{{ trailerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeTrailer }}\" style=\"position:fixed;inset:0;z-index:100;background:rgba(11,10,9,0.92);display:flex;align-items:center;justify-content:center;padding:clamp(16px,4vw,64px)\">\n    <div sc-camel-on-click=\"{{ stop }}\" style=\"width:min(100%,1100px);display:flex;flex-direction:column;gap:16px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px\">\n        <div style=\"font-family:'Cormorant Garamond',serif;font-size:28px\">{{ trailer.title }}</div>\n        <button sc-camel-on-click=\"{{ closeTrailer }}\" style=\"font:inherit;font-size:14px;color:#ede6da;background:none;border:1px solid rgba(237,230,218,0.35);padding:8px 16px;border-radius:999px;cursor:pointer\">Закрыть</button>\n      </div>\n      <div style=\"aspect-ratio:16/9\"><image-slot id=\"{{ trailer.slot }}\" shape=\"rect\" placeholder=\"Официальный трейлер: встроенный плеер издателя\"></image-slot></div>\n    </div>\n  </div>\n</sc-if>\n\n</div>\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;headlineVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;A&quot;,&quot;B&quot;],&quot;default&quot;:&quot;A&quot;,&quot;tsType&quot;:&quot;'A'|'B'&quot;,&quot;section&quot;:&quot;A/B-тест&quot;},&quot;showAssetLine&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;A/B-тест&quot;},&quot;showGenres&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Блоки&quot;}}\">\nconst GAMES=[\n {t:'Stardew Valley',v:'stardew',l:'41 млн копий · ~$185 млн*'},\n {t:'Civilization VI',v:'civilization',l:'11 млн копий'},\n {t:'Forza Horizon 5',v:'forza',l:'5 млн копий · ~$300 млн*'},\n {t:'Cyberpunk 2077',v:'cyberpunk',l:'40 млн копий · $750 млн+'},\n {t:'Red Dead Redemption 2',v:'rdr2',l:'87 млн копий · $725 млн за 3 дня'},\n {t:'Clair Obscur: Expedition 33',v:'clair',l:'8 млн копий · бюджет < $10 млн'}\n];\nconst FORMATS=[\n {label:'Телефон',num:'$113,3 млрд',growth:'+10,7%',line:'Самый большой рынок. Игра всегда в кармане.',ph:'Видео: Genshin Impact'},\n {label:'Приставка',num:'$44,7 млрд',growth:'+2,8%',line:'Большой экран и сильные истории.',ph:'Видео: Red Dead Redemption 2',v:'console_rdr2'},\n {label:'Компьютер',num:'$43,6 млрд',growth:'+12,0%',line:'Самый быстрый рост. Steam открыт и для небольших проектов.',ph:'Видео: Stardew Valley'}\n];\nconst GENRES=[\n {id:'strategy',label:'Строить и управлять',inside:'Стратегии и симуляторы',video:'Civilization VI',\n  pc:['Civilization VI','Stardew Valley','Cities: Skylines'],mobile:['Clash of Clans','Rise of Kingdoms','Whiteout Survival'],\n  a:['Глубокие системы и ощущение, что каждое решение меняет мир.','Дополнения с новыми фракциями и сценариями, на телефоне — ускорение прогресса.','Необычные сеттинги и короткие партии для тех, у кого мало времени.','Сильная стратегия возможна силами небольшой команды, если держаться одной ясной идеи. Бюджет обсуждаем на встрече.','Высокий порог входа для новичков и долгая настройка баланса.']},\n {id:'racing',label:'Скорость и техника',inside:'Гонки',video:'Forza Horizon 5',\n  pc:['Forza Horizon 5','Gran Turismo 7','F1 24'],mobile:['Asphalt Legends','CSR Racing 2','Real Racing 3'],\n  a:['Ощущение скорости, желанные машины и красивые трассы.','Новые машины, кастомизация, сезонные пропуска.','Аркадные гонки с ярким стилем и вымышленные миры вместо реальных трасс.','Реалистичные гонки требуют больших бюджетов, аркадный формат реальнее.','Лицензии на реальные машины дорогие, лидеры удерживают аудиторию годами.']},\n {id:'shooter',label:'Сражения',inside:'Шутеры и боевые игры',video:'Cyberpunk 2077',\n  pc:['Cyberpunk 2077','Counter-Strike 2','Call of Duty'],mobile:['PUBG Mobile','Call of Duty: Mobile','Free Fire'],\n  a:['Отточенная стрельба, сильная атмосфера и постоянные обновления.','Косметика, боевые пропуска, сюжетные дополнения.','Кооперативные и короткие сессионные игры с ярким сеттингом.','Сетевой шутер дорог в поддержке, одиночный или кооперативный формат реальнее.','Высокая конкуренция, расходы на серверы и защиту от читеров.']},\n {id:'rpg',label:'Приключения и история',inside:'Ролевые игры',video:'Clair Obscur: Expedition 33',\n  pc:['Clair Obscur: Expedition 33',\"Baldur's Gate 3\",'Elden Ring'],mobile:['Genshin Impact','Honkai: Star Rail','Pokémon GO'],\n  a:['Сильная история, запоминающиеся герои и мир, который хочется исследовать.','Сама игра и сюжетные расширения, на телефоне — новые герои.','Компактные истории с узнаваемым визуальным стилем.','Компактная ролевая игра с сильной историей реальнее огромного открытого мира.','Много контента: сценарий, персонажи, озвучка. Сроки легко растягиваются.']}\n];\nconst AKEYS=['Что объединяет лидеров','За что платят игроки','Где есть место для новой игры','Реалистичные масштаб и бюджет','Риски жанра'];\nconst PLATFORMS=['Телефон','Приставка','Компьютер','Пока не знаю'];\nconst MOTIVES=['Драйв и реализация','Потенциальный доход','И то и другое'];\nconst BUDGETS=['3–5 млн ₽','5–10 млн ₽','Более 10 млн ₽'];\nconst PATH=[\n ['Разговор','
