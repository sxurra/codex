name: Import game screenshots
on:
  push:
    paths:
      - .github/workflows/import-case-images.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download game screenshots
        run: |
          python -m pip install --quiet google-play-scraper
          python - <<'PY'
          from google_play_scraper import search, app
          from urllib.request import Request, urlopen
          from pathlib import Path
          import json
          out = Path('site/assets'); out.mkdir(parents=True, exist_ok=True)
          queries = {3:'Phoenix 2 Firi Games',4:'Over Rush Runner Game Inpleron',5:'Stick Fighter Battle Stickman Levis Kron',6:'Anger Foot 3D Shakabuy Games'}
          report = {}
          for n, query in queries.items():
              try:
                  hits = search(query, lang='en', country='us', n_hits=6)
              except Exception as e:
                  report[n] = {'error': str(e)}
                  continue
              report[n] = [{'title':h.get('title'),'appId':h.get('appId')} for h in hits]
              if not hits: continue
              wanted = {3:'Phoenix 2',4:'Over Rush: Runner Game',5:'Stick Fighter: Battle Stickman',6:'Anger Foot 3D'}[n]
              hit = next((h for h in hits if h.get('title','').casefold()==wanted.casefold()), hits[0])
              try:
                  info = app(hit['appId'], lang='en', country='us')
              except Exception as e:
                  report[n].append({'error': str(e)})
                  continue
              report[n].append({'selected':hit['appId'],'screenshots':len(info.get('screenshots',[]))})
              for k,url in enumerate(info.get('screenshots',[])[:6],1):
                  req=Request(url, headers={'User-Agent':'Mozilla/5.0'})
                  try:
                      data=urlopen(req, timeout=30).read()
                      (out/f'game-{n}-{k}.jpg').write_bytes(data)
                  except Exception as e: report[n].append({'failed':k,'error':str(e)})
          (out/'game-image-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          file site/assets/game-*.jpg || true
      - name: Save downloaded images
        run: |
          git config user.name 'Codex image import'
          git config user.email 'codex@users.noreply.github.com'
          git add site/assets/game-* site/assets/game-image-report.json
          git commit -m 'Import game screenshots from store listings'
          git push origin HEAD:refs/heads/game-screenshots-import
