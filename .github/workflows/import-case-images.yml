name: Import case gameplay screenshots
on:
  push:
    paths:
      - .github/workflows/import-case-images.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download gameplay images from source article
        run: |
          set -euo pipefail
          mkdir -p site/assets
          file site/assets/case-*-cover.png
      - name: Save gameplay images to an import branch
        run: |
          set -euo pipefail
          git config user.name 'Codex image import'
          git config user.email 'codex@users.noreply.github.com'
          git add site/assets/case-*-cover.png
          git commit -m 'Import game cover screenshots from Teletype article'
          git push origin HEAD:refs/heads/case-covers-import
