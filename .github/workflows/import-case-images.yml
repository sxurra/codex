name: Import case gameplay screenshots
on:
  push:
    paths:
      - .github/workflows/import-case-images.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download gameplay images from source article
        run: |
          set -euo pipefail
          mkdir -p site/assets
          curl --fail --location --retry 3 --max-time 60 'https://img2.teletype.in/files/9f/7a/9f7a0e26-c3ca-4ea4-9a22-38b65ea93db5.png' -o site/assets/case-1-shot.png
          curl --fail --location --retry 3 --max-time 60 'https://img3.teletype.in/files/e1/81/e1811974-0370-4073-82b7-4a3932912265.png' -o site/assets/case-2-shot.png
          curl --fail --location --retry 3 --max-time 60 'https://img4.teletype.in/files/fd/a6/fda6b7ca-a2dc-47fe-9a3a-496a518c45c8.png' -o site/assets/case-2-alt.png
          curl --fail --location --retry 3 --max-time 60 'https://img2.teletype.in/files/57/33/573305c7-004f-4a50-91e6-e2788ea82d69.jpeg' -o site/assets/case-3-shot.jpg
          curl --fail --location --retry 3 --max-time 60 'https://img1.teletype.in/files/8c/c1/8cc17e5a-1aec-4deb-8be2-2ebb7f3d8c28.png' -o site/assets/case-3-alt.png
          curl --fail --location --retry 3 --max-time 60 'https://img3.teletype.in/files/a8/4d/a84daaca-8c21-4189-b133-bfef3b44064c.jpeg' -o site/assets/case-4-shot.jpg
          curl --fail --location --retry 3 --max-time 60 'https://img2.teletype.in/files/de/55/de554238-1d31-411a-a3ba-0d655fdfad28.png' -o site/assets/case-4-alt.png
          curl --fail --location --retry 3 --max-time 60 'https://img3.teletype.in/files/6a/a2/6aa2d641-2d0c-446f-bcf5-4b0821876e7a.jpeg' -o site/assets/case-5-shot.jpg
          curl --fail --location --retry 3 --max-time 60 'https://img3.teletype.in/files/a0/3c/a03ca6f2-2e83-411a-9abe-0a057db030b6.png' -o site/assets/case-5-alt.png
          curl --fail --location --retry 3 --max-time 60 'https://img4.teletype.in/files/34/09/340901e6-8d3c-4f71-9054-092e298983e3.png' -o site/assets/case-6-shot.png
          file site/assets/case-*-shot.* site/assets/case-*-alt.*
      - name: Save gameplay images to an import branch
        run: |
          set -euo pipefail
          git config user.name 'Codex image import'
          git config user.email 'codex@users.noreply.github.com'
          git add site/assets/case-*-shot.* site/assets/case-*-alt.*
          git commit -m 'Import gameplay screenshots from Teletype article'
          git push origin HEAD:refs/heads/case-screenshots-import
